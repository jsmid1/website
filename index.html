<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahoj Ivo!</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #fce4ec, #f8bbd0, #f48fb1, #f8bbd0, #fce4ec);
            background-size: 400% 400%;
            animation: gradient 8s ease infinite;
            font-family: 'Georgia', serif;
            overflow: hidden;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            text-align: center;
            position: relative;
        }

        h1 {
            font-size: 5rem;
            color: #ad1457;
            text-shadow: 0 2px 10px rgba(173, 20, 87, 0.3);
            animation: pop 2s ease-in-out infinite alternate;
            position: relative;
            z-index: 1;
        }

        @keyframes pop {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }

        .flower {
            position: fixed;
            font-size: 2rem;
            opacity: 0.6;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(15deg); }
        }

        .sparkle {
            position: fixed;
            width: 6px;
            height: 6px;
            background: #ec407a;
            border-radius: 50%;
            animation: twinkle 3s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.8); }
        }

        .heart {
            position: fixed;
            font-size: 1.5rem;
            opacity: 0;
            animation: rise 4s ease-in infinite;
        }

        @keyframes rise {
            0% { opacity: 0; transform: translateY(0) scale(0.5); }
            50% { opacity: 0.7; }
            100% { opacity: 0; transform: translateY(-100vh) scale(1.2); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Ahoj Ivo!</h1>
    </div>

    <script>
        const flowers = ['🌸', '🌺', '🌷', '💮', '🏵️'];
        for (let i = 0; i < 12; i++) {
            const el = document.createElement('div');
            el.className = 'flower';
            el.textContent = flowers[i % flowers.length];
            el.style.left = Math.random() * 100 + 'vw';
            el.style.top = Math.random() * 100 + 'vh';
            el.style.animationDelay = Math.random() * 6 + 's';
            el.style.animationDuration = (5 + Math.random() * 4) + 's';
            document.body.appendChild(el);
        }

        for (let i = 0; i < 20; i++) {
            const el = document.createElement('div');
            el.className = 'sparkle';
            el.style.left = Math.random() * 100 + 'vw';
            el.style.top = Math.random() * 100 + 'vh';
            el.style.animationDelay = Math.random() * 3 + 's';
            document.body.appendChild(el);
        }

        for (let i = 0; i < 8; i++) {
            const el = document.createElement('div');
            el.className = 'heart';
            el.textContent = '♥';
            el.style.left = Math.random() * 100 + 'vw';
            el.style.bottom = '-20px';
            el.style.color = '#e91e63';
            el.style.animationDelay = Math.random() * 8 + 's';
            el.style.animationDuration = (3 + Math.random() * 3) + 's';
            document.body.appendChild(el);
        }
    </script>
</body>
</html>
